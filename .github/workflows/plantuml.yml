name: Generate and Update PlantUML Diagrams

on:
  push:
    branches:
      - main  # замените, если используете другую ветку

jobs:
  build-diagrams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'

      - name: Download PlantUML
        run: |
          curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar

      - name: Remove old SVGs matching PUMLs
        run: |
          find diagrams -name '*.puml' | while read file; do
            svg="${file%.puml}.svg"
            if [ -f "$svg" ]; then
              echo "Removing old SVG: $svg"
              rm "$svg"
            fi
          done

      - name: Generate SVGs from PUMLs
        run: |
          java -jar plantuml.jar -tsvg diagrams/*.puml

      - name: Commit and push updated SVGs
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add diagrams/*.svg
          git commit -m "Auto-update SVGs from PUML files" || echo "No changes to commit"
          git push
