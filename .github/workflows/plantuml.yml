name: Render PlantUML Diagrams

on:
  push:
    branches:
      - search
    paths:
      - '**.puml'

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download PlantUML
        run: |
          curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar

      - name: Render diagrams to docs/
        run: |
          mkdir -p docs
          find . -name '*.puml'
          find . -name '*.puml' | while read -r file; do
            java -jar plantuml.jar -tsvg "$file" -o docs
          done
          echo "Generated files:"
          ls -la docs/

      - name: Commit and push rendered SVGs
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add docs/*.svg
          git commit -m "Auto-render PlantUML diagrams" || echo "Nothing to commit"
          git push origin search
