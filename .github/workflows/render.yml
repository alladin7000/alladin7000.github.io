name: Render PlantUML diagrams

on:
  push:
    paths:
      - '**.puml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Download PlantUML jar
        run: |
          curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml-1.2024.4.jar

      - name: Render PUML diagrams to SVG
        run: |
          mkdir -p docs
          find . -name '*.puml' | while read -r file; do
            filename=$(basename "$file" .puml)
            java -jar plantuml.jar -tsvg "$file" -o docs
          done

      - name: Upload rendered diagrams
        uses: actions/upload-artifact@v3
        with:
          name: rendered-diagrams
          path: 'docs/*.svg'
