name: Render PlantUML diagrams

on:
  push:
    paths:
      - '**.puml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Graphviz (for PlantUML)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Download PlantUML jar
        run: |
          curl -L -o plantuml.jar https://downloads.plantuml.com/plantuml-1.2024.4.jar

      - name: Render PUML diagrams to SVG
        run: |
          mkdir -p docs
          find . -name '*.puml' | while read -r file; do
            filename=$(basename "$file" .puml)
            java -jar plantuml.jar -tsvg "$file" -o docs
          done

      - name: Commit rendered SVGs to docs/
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.svg
          git commit -m "Auto-generate SVG diagrams" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
