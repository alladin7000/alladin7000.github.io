name: Render PlantUML diagrams

on:
  push:
    paths:
      - 'diagrams/**/*.puml'
      - '.github/workflows/render-puml.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java 17 (Zulu)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Download PlantUML JAR
        run: curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2025.2/plantuml-1.2025.2.jar

      - name: Render diagrams to SVG
        run: |
          mkdir -p docs
          find diagrams -name '*.puml' | while read file; do
            echo "Rendering $file"
            java -jar plantuml.jar -tsvg "$file" -o ../docs
          done
          echo "Generated files in docs:"
          ls -la docs

      - name: Create timestamped .txt file
        run: |
          timestamp=$(date +%Y%m%d%H%M%S)
          txt_file="docs/render_log_${timestamp}.txt"
          echo "Render completed at ${timestamp}" > $txt_file
          echo "Log saved as $txt_file"
          ls -la docs  

      - name: Clean up old .txt files
        run: |
          # Считаем количество .txt файлов в папке docs
          txt_files_count=$(ls docs/*.txt 2>/dev/null | wc -l)
          if [ "$txt_files_count" -gt 1 ]; then
            # Удаляем все файлы, кроме самого нового
            echo "Found $txt_files_count .txt files, deleting old ones"
            ls -t docs/*.txt | tail -n +2 | xargs rm
          else
            echo "Only one .txt file found, no need to delete."
          fi
          ls -la docs  # Выводим содержимое папки docs после очистки

      - name: Commit and push rendered diagrams
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add docs/*.svg docs/*.txt || echo "No SVGs or logs to add"
          git commit -m "Auto-render PlantUML diagrams and log" || echo "Nothing to commit"
          git push origin search
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
